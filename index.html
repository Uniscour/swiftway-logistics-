<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftWay Logistics - Connexion</title>
    <!-- Tailwind CSS pour un design propre et moderne -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-blue-600">SwiftWay Logistics</h1>
            <p class="text-sm text-gray-500 mt-1">Connectez-vous ou créez votre compte</p>
        </div>

        <!-- Message d'alerte -->
        <div id="alert-box" class="hidden mb-4 p-3 rounded-lg text-sm text-center"></div>

        <form id="auth-form" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" required placeholder="votre@email.com" 
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
                <div class="relative">
                    <input type="password" id="password" required placeholder="••••••••" 
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    <button type="button" id="toggle-password" class="absolute right-3 top-3 text-gray-400 hover:text-gray-600">
                        👁️
                    </button>
                </div>
            </div>

            <button type="submit" id="submit-btn" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition shadow-md">
                Se connecter / S'inscrire
            </button>
        </form>
    </div>

    <script>
        // Remplace ces valeurs par tes propres clés Supabase (URL et Anon Key)
        const SUPABASE_URL = 'VOTRE_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'VOTRE_SUPABASE_ANON_KEY';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Gestion de l'affichage du mot de passe
        const togglePasswordBtn = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        togglePasswordBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePasswordBtn.textContent = type === 'password' ? '👁️' : '🙈';
        });

        const authForm = document.getElementById('auth-form');
        const alertBox = document.getElementById('alert-box');

        function showAlert(message, isError = true) {
            alertBox.textContent = message;
            alertBox.className = `mb-4 p-3 rounded-lg text-sm text-center ${isError ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
            alertBox.classList.remove('hidden');
        }

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = passwordInput.value;

            showAlert("Traitement en cours...", false);

            // 1. Tenter la connexion
            let { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                // 2. Si l'utilisateur n'existe pas, on tente l'inscription automatique
                let signUpResult = await supabaseClient.auth.signUp({ email, password });
                
                if (signUpResult.error) {
                    showAlert(signUpResult.error.message);
                } else {
                    showAlert("Compte créé avec succès ! Redirection...", false);
                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
                }
            } else {
                showAlert("Connexion réussie ! Redirection...", false);
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
            }
        });
    </script>
</body>
</html>
