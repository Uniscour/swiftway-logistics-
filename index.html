<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftWay Logistics - Accueil & Connexion</title>
    <!-- Tailwind CSS pour un design professionnel et moderne -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        swiftblue: '#0047AB',
                    }
                }
            }
        }
    </script>
    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center p-4 relative">

    <!-- Bouton de changement de langue (Haut droite) -->
    <div class="absolute top-6 right-6">
        <button id="lang-toggle" class="flex items-center gap-2 bg-white px-4 py-2 rounded-full shadow-sm border border-gray-200 text-sm font-semibold text-gray-700 hover:bg-gray-100 transition">
            🌐 <span id="current-lang-text">EN</span>
        </button>
    </div>

    <!-- Carte Principale -->
    <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md border border-gray-100 transition-all duration-300">
        
        <!-- Logo et Titre -->
        <div class="text-center mb-10">
            <div class="mx-auto flex items-center justify-center w-20 h-20 bg-blue-50 rounded-full mb-4 text-swiftblue text-4xl font-bold shadow-inner">
                S
            </div>
            <h1 class="text-3xl font-extrabold text-swiftblue tracking-tight">SwiftWay Logistics</h1>
            <p id="t-subtitle" class="text-base text-gray-500 mt-2 font-medium">Gérez vos expéditions facilement</p>
        </div>

        <h2 id="t-welcome" class="text-2xl font-bold text-gray-900 mb-8 text-center">Bienvenue</h2>

        <!-- Message d'alerte -->
        <div id="alert-box" class="hidden mb-6 p-4 rounded-xl text-sm text-center font-medium"></div>

        <!-- Formulaire -->
        <form id="auth-form" class="space-y-6">
            <div>
                <label id="t-email-label" for="email" class="block text-sm font-semibold text-gray-700 mb-1.5">Email</label>
                <input type="email" id="email" required placeholder="votre@email.com" 
                    class="w-full px-5 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue focus:border-swiftblue outline-none transition duration-150 bg-gray-50 placeholder:text-gray-400">
            </div>

            <div>
                <label id="t-pass-label" for="password" class="block text-sm font-semibold text-gray-700 mb-1.5">Mot de passe</label>
                <div class="relative">
                    <input type="password" id="password" required placeholder="••••••••" 
                        class="w-full px-5 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue focus:border-swiftblue outline-none transition duration-150 bg-gray-50 placeholder:text-gray-400">
                    <button type="button" id="toggle-password" class="absolute right-4 top-3.5 text-gray-400 hover:text-swiftblue transition">
                        👁️
                    </button>
                </div>
            </div>

            <button type="submit" id="submit-btn" 
                class="w-full bg-swiftblue hover:bg-blue-700 text-white font-semibold py-3.5 rounded-xl transition duration-200 shadow-md hover:shadow-lg transform hover:-translate-y-0.5">
                Continuer
            </button>
        </form>

        <div class="text-center mt-8 text-sm text-gray-600">
            <span id="t-no-account">Pas encore de compte ?</span> 
            <a href="#" id="t-register-link" class="font-semibold text-swiftblue hover:text-blue-700 hover:underline transition">S'inscrire</a>
        </div>
    </div>

    <script>
        // *** CONFIGURATION SUPABASE ***
        const SUPABASE_URL = 'VOTRE_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'VOTRE_SUPABASE_ANON_KEY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // *** GESTION DE LA TRADUCTION BILINGUE ***
        const translations = {
            fr: {
                subtitle: "Gérez vos expéditions facilement",
                welcome: "Bienvenue",
                emailLabel: "Email",
                passLabel: "Mot de passe",
                submitBtn: "Continuer",
                noAccount: "Pas encore de compte ?",
                registerLink: "S'inscrire",
                langBtn: "EN",
                processing: "Vérification en cours...",
                successLogin: "Connexion réussie ! Redirection...",
                successSignup: "Compte créé avec succès ! Redirection...",
                fillAll: "Veuillez remplir tous les champs."
            },
            en: {
                subtitle: "Manage your shipments easily",
                welcome: "Welcome",
                emailLabel: "Email",
                passLabel: "Password",
                submitBtn: "Continue",
                noAccount: "Don't have an account?",
                registerLink: "Sign up",
                langBtn: "FR",
                processing: "Processing...",
                successLogin: "Login successful! Redirecting...",
                successSignup: "Account created successfully! Redirecting...",
                fillAll: "Please fill in all fields."
            }
        };

        let currentLang = 'fr';

        function updateLanguage(lang) {
            currentLang = lang;
            document.getElementById('current-lang-text').textContent = translations[lang].langBtn;
            document.getElementById('t-subtitle').textContent = translations[lang].subtitle;
            document.getElementById('t-welcome').textContent = translations[lang].welcome;
            document.getElementById('t-email-label').textContent = translations[lang].emailLabel;
            document.getElementById('t-pass-label').textContent = translations[lang].passLabel;
            document.getElementById('submit-btn').textContent = translations[lang].submitBtn;
            document.getElementById('t-no-account').textContent = translations[lang].noAccount;
            document.getElementById('t-register-link').textContent = translations[lang].registerLink;
        }

        document.getElementById('lang-toggle').addEventListener('click', () => {
            updateLanguage(currentLang === 'fr' ? 'en' : 'fr');
        });

        // *** GESTION DE L'ŒIL DU MOT DE PASSE ***
        const togglePasswordBtn = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        togglePasswordBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePasswordBtn.textContent = type === 'password' ? '👁️' : '🙈';
        });

        // *** LOGIQUE SUPABASE ***
        const authForm = document.getElementById('auth-form');
        const alertBox = document.getElementById('alert-box');
        const submitBtn = document.getElementById('submit-btn');

        function showAlert(message, type = 'error') {
            alertBox.textContent = message;
            if (type === 'error') {
                alertBox.className = "mb-6 p-4 rounded-xl text-sm text-center font-medium bg-red-50 text-red-700 border border-red-100";
            } else if (type === 'success') {
                alertBox.className = "mb-6 p-4 rounded-xl text-sm text-center font-medium bg-green-50 text-green-700 border border-green-100";
            } else {
                alertBox.className = "mb-6 p-4 rounded-xl text-sm text-center font-medium bg-blue-50 text-blue-700 border border-blue-100";
            }
            alertBox.classList.remove('hidden');
        }

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = passwordInput.value;
            const t = translations[currentLang];

            if (!email || !password) {
                showAlert(t.fillAll);
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = t.processing;
            submitBtn.classList.add('opacity-70', 'cursor-not-allowed');
            showAlert(t.processing, 'info');

            let { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                let signUpResult = await supabaseClient.auth.signUp({ email, password });
                
                if (signUpResult.error) {
                    showAlert("Erreur : " + signUpResult.error.message);
                    submitBtn.disabled = false;
                    submitBtn.textContent = t.submitBtn;
                    submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
                } else {
                    showAlert(t.successSignup, 'success');
                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
                }
            } else {
                showAlert(t.successLogin, 'success');
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
            }
        });
    </script>
</body>
</html>
