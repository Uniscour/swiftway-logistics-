<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftWay Logistics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { swiftblue: '#0047AB' } } } }
    </script>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Chargement -->
    <div id="loading" class="min-h-screen flex items-center justify-center text-gray-500 font-medium">Chargement...</div>

    <!-- ================= VUE CONNEXION ================= -->
    <div id="auth-view" class="hidden min-h-screen flex items-center justify-center p-4 relative">

        <div class="absolute top-6 right-6">
            <button id="lang-toggle" type="button" class="flex items-center gap-2 bg-white px-4 py-2 rounded-full shadow-sm border border-gray-200 text-sm font-semibold text-gray-700 hover:bg-gray-100 transition cursor-pointer">
                🌐 <span id="current-lang-text">EN</span>
            </button>
        </div>

        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md border border-gray-100">
            <div class="text-center mb-6 pt-2">
                <h1 class="text-3xl font-extrabold text-swiftblue tracking-tight">SwiftWay Logistics</h1>
                <p id="t-subtitle" class="text-base text-gray-500 mt-2 font-medium">Gérez vos expéditions facilement</p>
            </div>

            <div class="flex bg-gray-100 p-1 rounded-xl mb-6">
                <button id="tab-login" type="button" class="flex-1 py-2.5 text-sm font-semibold rounded-lg bg-white text-swiftblue shadow-sm transition cursor-pointer">Connexion</button>
                <button id="tab-signup" type="button" class="flex-1 py-2.5 text-sm font-semibold rounded-lg text-gray-500 hover:text-gray-900 transition cursor-pointer">S'inscrire</button>
            </div>

            <div id="alert-box" class="hidden mb-6 p-4 rounded-xl text-sm text-center font-medium"></div>

            <!-- Connexion -->
            <form id="login-form" class="space-y-5">
                <div>
                    <label id="t-login-email" class="block text-sm font-semibold text-gray-700 mb-1.5">Email</label>
                    <input type="email" id="login-email" required placeholder="votre@email.com"
                        class="w-full px-5 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue focus:border-swiftblue outline-none transition bg-gray-50">
                </div>
                <div>
                    <label id="t-login-pass" class="block text-sm font-semibold text-gray-700 mb-1.5">Mot de passe</label>
                    <div class="relative">
                        <input type="password" id="login-password" required placeholder="••••••••"
                            class="w-full px-5 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue focus:border-swiftblue outline-none transition bg-gray-50">
                        <button type="button" class="toggle-password absolute right-4 top-3.5 text-gray-400 hover:text-swiftblue transition cursor-pointer">👁️</button>
                    </div>
                </div>
                <button type="submit" id="login-btn"
                    class="w-full bg-swiftblue hover:bg-blue-700 text-white font-semibold py-3.5 rounded-xl transition duration-200 shadow-md cursor-pointer">
                    Se connecter
                </button>
            </form>

            <!-- Inscription -->
            <form id="signup-form" class="space-y-4 hidden">
                <div>
                    <label id="t-signup-email" class="block text-xs font-semibold text-gray-700 mb-1">Email</label>
                    <input type="email" id="signup-email" required placeholder="votre@email.com"
                        class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue focus:border-swiftblue outline-none transition bg-gray-50">
                </div>
                <div>
                    <label id="t-signup-phone" class="block text-xs font-semibold text-gray-700 mb-1">Numéro de téléphone</label>
                    <input type="tel" id="signup-phone" required placeholder="Ex: +237 6XXXXXXXX"
                        class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue focus:border-swiftblue outline-none transition bg-gray-50">
                </div>
                <div>
                    <label id="t-signup-pass" class="block text-xs font-semibold text-gray-700 mb-1">Mot de passe</label>
                    <div class="relative">
                        <input type="password" id="signup-password" required placeholder="••••••••"
                            class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue focus:border-swiftblue outline-none transition bg-gray-50">
                        <button type="button" class="toggle-password absolute right-4 top-3 text-gray-400 hover:text-swiftblue transition cursor-pointer">👁️</button>
                    </div>
                </div>
                <div>
                    <label id="t-signup-pass-confirm" class="block text-xs font-semibold text-gray-700 mb-1">Confirmer le mot de passe</label>
                    <div class="relative">
                        <input type="password" id="signup-password-confirm" required placeholder="••••••••"
                            class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue focus:border-swiftblue outline-none transition bg-gray-50">
                        <button type="button" class="toggle-password absolute right-4 top-3 text-gray-400 hover:text-swiftblue transition cursor-pointer">👁️</button>
                    </div>
                </div>
                <button type="submit" id="signup-btn"
                    class="w-full bg-swiftblue hover:bg-blue-700 text-white font-semibold py-3.5 rounded-xl transition duration-200 shadow-md mt-2 cursor-pointer">
                    S'inscrire
                </button>
            </form>
        </div>
    </div>

    <!-- ================= VUE TABLEAU DE BORD ================= -->
    <div id="dash-view" class="hidden">
        <header class="bg-white border-b border-gray-200">
            <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
                <div>
                    <h1 class="text-xl font-extrabold text-swiftblue tracking-tight">SwiftWay Logistics</h1>
                    <p id="user-email" class="text-xs text-gray-500 break-all"></p>
                </div>
                <button id="logout-btn" type="button"
                    class="text-sm font-semibold text-gray-600 hover:text-red-600 border border-gray-200 rounded-full px-4 py-2 bg-white transition cursor-pointer">
                    Se déconnecter
                </button>
            </div>
        </header>

        <main class="max-w-3xl mx-auto px-4 py-6">
            <div class="flex bg-gray-100 p-1 rounded-xl mb-6">
                <button data-tab="list" class="dtab flex-1 py-2.5 text-sm font-semibold rounded-lg cursor-pointer">Mes colis</button>
                <button data-tab="new" class="dtab flex-1 py-2.5 text-sm font-semibold rounded-lg cursor-pointer">Nouvelle</button>
                <button data-tab="track" class="dtab flex-1 py-2.5 text-sm font-semibold rounded-lg cursor-pointer">Suivre</button>
            </div>

            <div id="d-alert" class="hidden mb-4 p-4 rounded-xl text-sm text-center font-medium"></div>

            <!-- Mes colis -->
            <section id="view-list"><div id="list-container"></div></section>

            <!-- Nouvelle expédition -->
            <section id="view-new" class="hidden">
                <form id="new-form" class="space-y-5">
                    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-6">
                    <div class="space-y-4">
                        <div><h3 class="text-base font-bold text-gray-900">Expéditeur</h3><p class="text-xs text-gray-500">La personne qui envoie le colis</p></div>
                        <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Nom complet</label>
                        <input id="s-name" required  class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue outline-none bg-gray-50">
                    </div>
                        <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Téléphone</label>
                        <input id="s-phone" required type="tel" placeholder="Ex: +237 6XXXXXXXX" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue outline-none bg-gray-50">
                    </div>
                        <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Email <span class="text-gray-400 font-normal">(facultatif)</span></label>
                        <input id="s-email" type="email" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue outline-none bg-gray-50">
                    </div>
                        <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Adresse (rue, numéro, point de repère)</label>
                        <input id="s-address" required  class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue outline-none bg-gray-50">
                    </div>
                        <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Quartier <span class="text-gray-400 font-normal">(facultatif)</span></label>
                        <input id="s-district"  class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue outline-none bg-gray-50">
                    </div>
                        <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Ville</label>
                        <input id="s-city" required  class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue outline-none bg-gray-50">
                    </div>
                        <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Région / Province</label>
                        <input id="s-region" required  class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue outline-none bg-gray-50">
                    </div>
                        <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Pays</label>
                        <select id="s-country" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue outline-none bg-gray-50"></select>
                    </div>
                    </div>
                    </div>

                    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-6">
                    <div class="space-y-4">
                        <div><h3 class="text-base font-bold text-gray-900">Destinataire</h3><p class="text-xs text-gray-500">La personne qui reçoit le colis</p></div>
                        <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Nom complet</label>
                        <input id="r-name" required  class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue outline-none bg-gray-50">
                    </div>
                        <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Téléphone</label>
                        <input id="r-phone" required type="tel" placeholder="Ex: +237 6XXXXXXXX" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue outline-none bg-gray-50">
                    </div>
                        <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Email <span class="text-gray-400 font-normal">(facultatif)</span></label>
                        <input id="r-email" type="email" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue outline-none bg-gray-50">
                    </div>
                        <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Adresse (rue, numéro, point de repère)</label>
                        <input id="r-address" required  class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue outline-none bg-gray-50">
                    </div>
                        <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Quartier <span class="text-gray-400 font-normal">(facultatif)</span></label>
                        <input id="r-district"  class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue outline-none bg-gray-50">
                    </div>
                        <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Ville</label>
                        <input id="r-city" required  class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue outline-none bg-gray-50">
                    </div>
                        <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Région / Province</label>
                        <input id="r-region" required  class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue outline-none bg-gray-50">
                    </div>
                        <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Pays</label>
                        <select id="r-country" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue outline-none bg-gray-50"></select>
                    </div>
                    </div>
                    </div>

                    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-6 space-y-4">
                        <div><h3 class="text-base font-bold text-gray-900">Le colis</h3><p class="text-xs text-gray-500">Ce que vous envoyez</p></div>
                        <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Contenu du colis</label>
                        <input id="p-desc" required placeholder="Ex: vêtements, documents..." class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue outline-none bg-gray-50">
                    </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Type de colis</label>
                            <select id="p-type" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue outline-none bg-gray-50">
                                <option>Documents</option><option>Vêtements</option><option>Électronique</option>
                                <option>Alimentaire</option><option>Cosmétiques</option><option>Pièces / Matériel</option><option>Autre</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Nombre de colis</label>
                        <input id="p-count" required value="1" type="number" min="1" step="1" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue outline-none bg-gray-50">
                    </div>
                            <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Poids total (kg)</label>
                        <input id="p-weight" required type="number" min="0.1" step="0.1" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue outline-none bg-gray-50">
                    </div>
                        </div>
                        <div>
                            <p class="text-xs font-semibold text-gray-700 mb-1">Dimensions en cm <span class="text-gray-400 font-normal">(facultatif)</span></p>
                            <div class="grid grid-cols-3 gap-3">
                                <input id="p-length" type="number" min="0" step="0.1" placeholder="Long." class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue outline-none bg-gray-50">
                                <input id="p-width" type="number" min="0" step="0.1" placeholder="Larg." class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue outline-none bg-gray-50">
                                <input id="p-height" type="number" min="0" step="0.1" placeholder="Haut." class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue outline-none bg-gray-50">
                            </div>
                        </div>
                        <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Valeur déclarée (FCFA) <span class="text-gray-400 font-normal">(facultatif)</span></label>
                        <input id="p-value" type="number" min="0" step="1" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue outline-none bg-gray-50">
                    </div>
                    </div>

                    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-6 space-y-4">
                        <div><h3 class="text-base font-bold text-gray-900">Livraison</h3></div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Type de service</label>
                            <select id="p-service" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue outline-none bg-gray-50">
                                <option value="standard">Standard</option>
                                <option value="express">Express (plus rapide)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Qui paie la livraison ?</label>
                            <select id="p-payer" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue outline-none bg-gray-50">
                                <option value="sender">L'expéditeur</option>
                                <option value="receiver">Le destinataire</option>
                            </select>
                        </div>
                        <label class="flex items-center gap-3 text-sm font-semibold text-gray-700">
                            <input id="p-fragile" type="checkbox" class="w-5 h-5 rounded border-gray-300"> Colis fragile
                        </label>
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Instructions de livraison <span class="text-gray-400 font-normal">(facultatif)</span></label>
                            <textarea id="p-notes" rows="3" placeholder="Ex: appeler avant de livrer, laisser chez le gardien..." class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue outline-none bg-gray-50"></textarea>
                        </div>
                    </div>

                    <button type="submit" id="new-btn" class="w-full bg-swiftblue hover:bg-blue-700 text-white font-semibold py-3.5 rounded-xl transition shadow-md cursor-pointer">
                        Créer l'expédition
                    </button>
                </form>
            </section>

            <!-- Suivre un colis -->
            <section id="view-track" class="hidden space-y-4">
                <form id="track-form" class="bg-white rounded-3xl shadow-sm border border-gray-100 p-6 space-y-4">
                    <h2 class="text-lg font-bold text-gray-900">Suivre un colis</h2>
                    <input id="track-code" required placeholder="Code de suivi, ex: SW1A2B3C4D" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue outline-none bg-gray-50 uppercase">
                    <button type="submit" class="w-full bg-swiftblue hover:bg-blue-700 text-white font-semibold py-3.5 rounded-xl transition shadow-md cursor-pointer">Rechercher</button>
                </form>
                <div id="track-result"></div>
            </section>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://cwgpxyiodzxcabkavdbk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_zXgU5Q2p2UL3--3no-spmA_noD8JRvF';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ---------- Affichage des vues ----------
        const $ = (id) => document.getElementById(id);

        function showAuthView() {
            $('loading').classList.add('hidden');
            $('dash-view').classList.add('hidden');
            $('auth-view').classList.remove('hidden');
        }

        function showDashView(user) {
            $('loading').classList.add('hidden');
            $('auth-view').classList.add('hidden');
            $('user-email').textContent = (user && user.email) || '';
            $('dash-view').classList.remove('hidden');
            showTab('list');
        }

        // =====================================================
        //                    CONNEXION
        // =====================================================
        const tabLogin = $('tab-login');
        const tabSignup = $('tab-signup');
        const loginForm = $('login-form');
        const signupForm = $('signup-form');
        const alertBox = $('alert-box');

        function hideAlert() { alertBox.classList.add('hidden'); }

        tabLogin.addEventListener('click', () => {
            tabLogin.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg bg-white text-swiftblue shadow-sm transition cursor-pointer";
            tabSignup.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg text-gray-500 hover:text-gray-900 transition cursor-pointer";
            loginForm.classList.remove('hidden');
            signupForm.classList.add('hidden');
            hideAlert();
        });

        tabSignup.addEventListener('click', () => {
            tabSignup.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg bg-white text-swiftblue shadow-sm transition cursor-pointer";
            tabLogin.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg text-gray-500 hover:text-gray-900 transition cursor-pointer";
            signupForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
            hideAlert();
        });

        const translations = {
            fr: {
                subtitle: "Gérez vos expéditions facilement",
                loginTab: "Connexion", signupTab: "S'inscrire",
                email: "Email", password: "Mot de passe",
                confirmPassword: "Confirmer le mot de passe", phone: "Numéro de téléphone",
                loginBtn: "Se connecter", signupBtn: "S'inscrire",
                langToggleDisplay: "EN",
                processing: "Traitement en cours...",
                successLogin: "Connexion réussie !",
                successSignup: "Compte créé avec succès !",
                confirmEmail: "Compte créé ! Vérifiez votre email pour confirmer votre compte, puis connectez-vous.",
                passMismatch: "Les mots de passe ne correspondent pas."
            },
            en: {
                subtitle: "Manage your shipments easily",
                loginTab: "Login", signupTab: "Sign up",
                email: "Email", password: "Password",
                confirmPassword: "Confirm Password", phone: "Phone Number",
                loginBtn: "Login", signupBtn: "Sign up",
                langToggleDisplay: "FR",
                processing: "Processing...",
                successLogin: "Login successful!",
                successSignup: "Account created successfully!",
                confirmEmail: "Account created! Check your email to confirm your account, then log in.",
                passMismatch: "Passwords do not match."
            }
        };

        let currentLang = 'fr';

        function updateLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            $('current-lang-text').textContent = t.langToggleDisplay;
            $('t-subtitle').textContent = t.subtitle;
            tabLogin.textContent = t.loginTab;
            tabSignup.textContent = t.signupTab;
            $('t-login-email').textContent = t.email;
            $('t-login-pass').textContent = t.password;
            $('login-btn').textContent = t.loginBtn;
            $('t-signup-email').textContent = t.email;
            $('t-signup-phone').textContent = t.phone;
            $('t-signup-pass').textContent = t.password;
            $('t-signup-pass-confirm').textContent = t.confirmPassword;
            $('signup-btn').textContent = t.signupBtn;
        }

        $('lang-toggle').addEventListener('click', (e) => {
            e.preventDefault();
            updateLanguage(currentLang === 'fr' ? 'en' : 'fr');
        });

        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const input = e.target.previousElementSibling;
                const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);
                e.target.textContent = type === 'password' ? '👁️' : '🙈';
            });
        });

        function showAlert(message, type = 'error') {
            alertBox.textContent = message;
            alertBox.className = `mb-6 p-4 rounded-xl text-sm text-center font-medium ${type === 'error' ? 'bg-red-50 text-red-700 border border-red-100' : 'bg-green-50 text-green-700 border border-green-100'}`;
            alertBox.classList.remove('hidden');
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = $('login-email').value.trim();
            const password = $('login-password').value;
            const t = translations[currentLang];

            showAlert(t.processing, 'success');
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                showAlert(error.message);
            } else {
                hideAlert();
                showDashView(data.user);
            }
        });

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = $('signup-email').value.trim();
            const phone = $('signup-phone').value.trim();
            const password = $('signup-password').value;
            const passwordConfirm = $('signup-password-confirm').value;
            const t = translations[currentLang];

            if (password !== passwordConfirm) { showAlert(t.passMismatch); return; }

            showAlert(t.processing, 'success');
            const { data, error } = await supabaseClient.auth.signUp({
                email, password, options: { data: { phone_number: phone } }
            });

            if (error) {
                showAlert(error.message);
            } else if (data.session) {
                hideAlert();
                showDashView(data.user);
            } else {
                showAlert(t.confirmEmail, 'success');
            }
        });

        // =====================================================
        //                  TABLEAU DE BORD
        // =====================================================
        const STATUS = {
            pending:          { label: 'En attente',            color: 'bg-gray-100 text-gray-700' },
            picked_up:        { label: 'Colis récupéré',        color: 'bg-blue-50 text-blue-700' },
            in_transit:       { label: 'En transit',            color: 'bg-indigo-50 text-indigo-700' },
            out_for_delivery: { label: 'En cours de livraison', color: 'bg-amber-50 text-amber-700' },
            delivered:        { label: 'Livré',                 color: 'bg-green-50 text-green-700' },
            cancelled:        { label: 'Annulé',                color: 'bg-red-50 text-red-700' }
        };

        const dAlert = $('d-alert');

        const COUNTRIES = [
    "Afghanistan","Afrique du Sud","Albanie","Algérie","Allemagne","Andorre","Angola","Antigua-et-Barbuda","Arabie saoudite","Argentine","Arménie","Australie","Autriche","Azerbaïdjan",
    "Bahamas","Bahreïn","Bangladesh","Barbade","Belgique","Belize","Bénin","Bhoutan","Biélorussie","Birmanie (Myanmar)","Bolivie","Bosnie-Herzégovine","Botswana","Brésil","Brunei","Bulgarie","Burkina Faso","Burundi",
    "Cambodge","Cameroun","Canada","Cap-Vert","Chili","Chine","Chypre","Colombie","Comores","Congo","Corée du Nord","Corée du Sud","Costa Rica","Côte d'Ivoire","Croatie","Cuba",
    "Danemark","Djibouti","Dominique","Égypte","Émirats arabes unis","Équateur","Érythrée","Espagne","Estonie","Eswatini","États-Unis","Éthiopie",
    "Fidji","Finlande","France","Gabon","Gambie","Géorgie","Ghana","Grèce","Grenade","Guatemala","Guinée","Guinée-Bissau","Guinée équatoriale","Guyana",
    "Haïti","Honduras","Hongrie","Îles Marshall","Îles Salomon","Inde","Indonésie","Irak","Iran","Irlande","Islande","Israël","Italie",
    "Jamaïque","Japon","Jordanie","Kazakhstan","Kenya","Kirghizistan","Kiribati","Koweït",
    "Laos","Lesotho","Lettonie","Liban","Libéria","Libye","Liechtenstein","Lituanie","Luxembourg",
    "Macédoine du Nord","Madagascar","Malaisie","Malawi","Maldives","Mali","Malte","Maroc","Maurice","Mauritanie","Mexique","Micronésie","Moldavie","Monaco","Mongolie","Monténégro","Mozambique",
    "Namibie","Nauru","Népal","Nicaragua","Niger","Nigéria","Norvège","Nouvelle-Zélande","Oman","Ouganda","Ouzbékistan",
    "Pakistan","Palaos","Palestine","Panama","Papouasie-Nouvelle-Guinée","Paraguay","Pays-Bas","Pérou","Philippines","Pologne","Portugal","Qatar",
    "République centrafricaine","République démocratique du Congo","République dominicaine","Roumanie","Royaume-Uni","Russie","Rwanda",
    "Saint-Christophe-et-Niévès","Sainte-Lucie","Saint-Marin","Saint-Vincent-et-les-Grenadines","Salvador","Samoa","Sao Tomé-et-Principe","Sénégal","Serbie","Seychelles","Sierra Leone","Singapour","Slovaquie","Slovénie","Somalie","Soudan","Soudan du Sud","Sri Lanka","Suède","Suisse","Suriname","Syrie",
    "Tadjikistan","Tanzanie","Tchad","Tchéquie","Thaïlande","Timor oriental","Togo","Tonga","Trinité-et-Tobago","Tunisie","Turkménistan","Turquie","Tuvalu",
    "Ukraine","Uruguay","Vanuatu","Vatican (Saint-Siège)","Venezuela","Viêt Nam","Yémen","Zambie","Zimbabwe"
];

function fillCountries() {
    // Cameroun en premier (sélectionné par défaut), puis les autres par ordre alphabétique
    const others = COUNTRIES.filter(c => c !== "Cameroun").sort((a, b) => a.localeCompare(b, 'fr'));
    const options = ["Cameroun", ...others].map(c => `<option value="${c}">${c}</option>`).join('');
    ['s-country', 'r-country'].forEach(id => { $(id).innerHTML = options; });
}
fillCountries();

function esc(v) {
            return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }
        function fmtDate(d) {
            return new Date(d).toLocaleString('fr-FR', { dateStyle: 'medium', timeStyle: 'short' });
        }
        function badge(status) {
            const s = STATUS[status] || { label: status, color: 'bg-gray-100 text-gray-700' };
            return `<span class="inline-block px-3 py-1 rounded-full text-xs font-semibold ${s.color}">${esc(s.label)}</span>`;
        }
        function dShow(msg, type = 'error') {
            dAlert.textContent = msg;
            dAlert.className = `mb-4 p-4 rounded-xl text-sm text-center font-medium ${type === 'error'
                ? 'bg-red-50 text-red-700 border border-red-100'
                : 'bg-green-50 text-green-700 border border-green-100'}`;
        }
        function dHide() { dAlert.classList.add('hidden'); }

        // Étapes et jalons de la fenêtre de livraison (48 h standard / 24 h express)
        // Jalons en part de la fenêtre : 0 %, 12,5 % (6 h), 25 % (12 h), 75 % (36 h), 100 % (48 h)
        const STEPS = ['pending', 'picked_up', 'in_transit', 'out_for_delivery', 'delivered'];
        const STEP_FRAC = [0, 0.125, 0.25, 0.75, 1];

        function timeline(events, ship) {
            events = events || [];
            const byStatus = {};
            events.forEach(e => { if (!byStatus[e.status]) byStatus[e.status] = e; });

            const win = (ship && ship.delivery_window_hours) || 48;
            const start = ship ? new Date(ship.created_at).getTime() : null;
            const cancelled = !!ship && ship.status === 'cancelled';
            const idx = ship ? STEPS.indexOf(ship.status) : -1;
            const pct = ship ? (ship.status === 'delivered' ? 100 : Math.max(0, idx) * 25) : 0;
            const lastDone = STEPS.reduce((acc, st, i) => byStatus[st] ? i : acc, -1);

            let html = '';
            if (ship && !cancelled) {
                const eta = ship.estimated_delivery_at || (start ? new Date(start + win * 3600000).toISOString() : null);
                html += `<div class="mt-4">
                    <div class="flex justify-between text-xs text-gray-500 mb-1">
                        <span>${ship.status === 'delivered' ? 'Livré' : 'Livraison estimée'}</span>
                        <span class="font-semibold text-gray-700">${eta ? fmtDate(eta) : ''}</span>
                    </div>
                    <div class="w-full h-2 bg-gray-100 rounded-full overflow-hidden"><div class="h-2 bg-swiftblue rounded-full" style="width:${pct}%"></div></div>
                    <p class="text-xs text-gray-400 mt-1">Délai prévu : ${win} h (${ship.service_type === 'express' ? 'Express' : 'Standard'})</p>
                </div>`;
            }

            html += '<ol class="space-y-3 mt-4">' + STEPS.map((st, i) => {
                const ev = byStatus[st];
                const done = !!ev;
                const current = done && i === lastDone && !cancelled;
                const label = (STATUS[st] || { label: st }).label;
                const planned = start ? new Date(start + STEP_FRAC[i] * win * 3600000) : null;
                const dot = done ? (current ? 'bg-swiftblue ring-4 ring-blue-100' : 'bg-swiftblue') : 'bg-gray-200';
                const when = done
                    ? `<p class="text-xs text-gray-400">${fmtDate(ev.created_at)}</p>`
                    : (planned && !cancelled ? `<p class="text-xs text-gray-400">Prévu : ${fmtDate(planned)}</p>` : '');
                const note = done && ev.note ? `<p class="text-xs text-gray-500">${esc(ev.note)}</p>` : '';
                return `<li class="flex gap-3 ${done ? '' : 'opacity-60'}">
                    <span class="mt-1.5 w-3 h-3 rounded-full ${dot} shrink-0"></span>
                    <div><p class="text-sm font-semibold ${done ? 'text-gray-900' : 'text-gray-500'}">${esc(label)}</p>${note}${when}</div></li>`;
            }).join('') + '</ol>';

            if (cancelled) {
                const ev = byStatus['cancelled'];
                html += `<div class="mt-3 bg-red-50 text-red-700 rounded-xl p-3 text-sm font-semibold">Expédition annulée${ev ? ' · ' + fmtDate(ev.created_at) : ''}</div>`;
            }
            return html;
        }

        function line(label, v) { return v ? `<p class="text-sm text-gray-700"><span class="text-gray-400">${label} :</span> ${esc(v)}</p>` : ''; }
        function party(title, n, phone, email, addr, district, city, region, country) {
            return `<div class="bg-gray-50 rounded-xl p-3"><p class="text-xs font-bold text-swiftblue mb-1">${title}</p>
                <p class="text-sm font-semibold text-gray-900">${esc(n)}</p>
                ${line('Tél', phone)}${line('Email', email)}${line('Adresse', addr)}${line('Quartier', district)}
                <p class="text-sm text-gray-700">${esc([city, region, country].filter(Boolean).join(', '))}</p></div>`;
        }
        function detailsHtml(s) {
            if (!s) return '';
            const dims = (s.length_cm || s.width_cm || s.height_cm) ? [s.length_cm, s.width_cm, s.height_cm].map(v => v ?? '?').join(' x ') + ' cm' : '';
            return `<div class="mt-3 space-y-2">
                ${party('Expéditeur', s.sender_name, s.sender_phone, s.sender_email, s.sender_address, s.sender_district, s.origin, s.sender_region, s.sender_country)}
                ${party('Destinataire', s.receiver_name, s.receiver_phone, s.receiver_email, s.receiver_address, s.receiver_district, s.destination, s.receiver_region, s.receiver_country)}
                <div class="bg-gray-50 rounded-xl p-3"><p class="text-xs font-bold text-swiftblue mb-1">Colis</p>
                    ${line('Contenu', s.description)}${line('Type', s.package_type)}${line('Nombre', s.package_count)}
                    ${line('Poids', s.weight_kg ? s.weight_kg + ' kg' : '')}${line('Dimensions', dims)}
                    ${line('Valeur déclarée', s.declared_value ? s.declared_value + ' FCFA' : '')}
                    ${line('Service', s.service_type === 'express' ? 'Express' : 'Standard')}
                    ${line('Paiement', s.payer === 'receiver' ? 'Le destinataire' : "L'expéditeur")}
                    ${s.is_fragile ? '<p class="text-sm font-semibold text-amber-700">Colis fragile</p>' : ''}
                    ${line('Instructions', s.delivery_instructions)}</div></div>`;
        }

        function showTab(name) {
            dHide();
            ['list', 'new', 'track'].forEach(t => $('view-' + t).classList.toggle('hidden', t !== name));
            document.querySelectorAll('.dtab').forEach(b => {
                const active = b.dataset.tab === name;
                b.className = 'dtab flex-1 py-2.5 text-sm font-semibold rounded-lg cursor-pointer transition ' +
                    (active ? 'bg-white text-swiftblue shadow-sm' : 'text-gray-500 hover:text-gray-900');
            });
            if (name === 'list') loadShipments();
        }
        document.querySelectorAll('.dtab').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));

        async function loadShipments() {
            const box = $('list-container');
            box.innerHTML = '<p class="text-center text-gray-500 py-8">Chargement...</p>';
            await supabaseClient.rpc('sw_advance_shipments');
            const { data, error } = await supabaseClient
                .from('sw_shipments').select('*').order('created_at', { ascending: false });

            if (error) {
                box.innerHTML = '';
                dShow("Impossible de charger les colis : " + error.message);
                return;
            }
            if (!data.length) {
                box.innerHTML = `<div class="bg-white rounded-3xl border border-gray-100 p-8 text-center">
                    <p class="text-gray-500 mb-4">Vous n'avez pas encore d'expédition.</p>
                    <button type="button" id="go-new" class="bg-swiftblue text-white font-semibold px-5 py-3 rounded-xl cursor-pointer">Créer ma première expédition</button></div>`;
                $('go-new').addEventListener('click', () => showTab('new'));
                return;
            }
            const byId = {}; data.forEach(s => { byId[s.id] = s; });
            box.innerHTML = data.map(s => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-3">
                    <div class="flex items-start justify-between gap-2">
                        <div>
                            <p class="font-bold text-gray-900">${esc(s.tracking_code)}</p>
                            <p class="text-sm text-gray-500">${esc(s.origin)} → ${esc(s.destination)}</p>
                            <p class="text-xs text-gray-400 mt-1">Pour ${esc(s.receiver_name)} · ${fmtDate(s.created_at)}</p>
                            ${s.estimated_delivery_at && s.status !== 'delivered' && s.status !== 'cancelled' ? `<p class="text-xs text-gray-500">Livraison estimée : ${fmtDate(s.estimated_delivery_at)}</p>` : ''}
                        </div>
                        ${badge(s.status)}
                    </div>
                    <button type="button" data-id="${esc(s.id)}" class="details-btn mt-3 text-sm font-semibold text-swiftblue cursor-pointer">Voir le suivi</button>
                    <div id="ev-${esc(s.id)}" class="hidden"></div>
                </div>`).join('');

            document.querySelectorAll('.details-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const holder = $('ev-' + btn.dataset.id);
                    if (!holder.classList.contains('hidden')) {
                        holder.classList.add('hidden');
                        btn.textContent = 'Voir le suivi';
                        return;
                    }
                    const { data: events, error: err } = await supabaseClient
                        .from('sw_shipment_events').select('*')
                        .eq('shipment_id', btn.dataset.id).order('created_at', { ascending: true });
                    holder.innerHTML = err ? '<p class="text-sm text-red-600 mt-3">Erreur de chargement.</p>' : detailsHtml(byId[btn.dataset.id]) + timeline(events, byId[btn.dataset.id]);
                    holder.classList.remove('hidden');
                    btn.textContent = 'Masquer le suivi';
                });
            });
        }

        $('new-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = $('new-btn');
            btn.disabled = true;
            btn.textContent = 'Création...';

            const txt = (id) => $(id).value.trim() || null;
            const num = (id) => { const v = $(id).value; return v === '' ? null : Number(v); };
            const { data, error } = await supabaseClient.from('sw_shipments').insert({
                sender_name: $('s-name').value.trim(),
                sender_phone: $('s-phone').value.trim(),
                sender_email: txt('s-email'),
                sender_address: $('s-address').value.trim(),
                sender_district: txt('s-district'),
                origin: $('s-city').value.trim(),
                sender_region: $('s-region').value.trim(),
                sender_country: $('s-country').value.trim(),
                receiver_name: $('r-name').value.trim(),
                receiver_phone: $('r-phone').value.trim(),
                receiver_email: txt('r-email'),
                receiver_address: $('r-address').value.trim(),
                receiver_district: txt('r-district'),
                destination: $('r-city').value.trim(),
                receiver_region: $('r-region').value.trim(),
                receiver_country: $('r-country').value.trim(),
                description: $('p-desc').value.trim(),
                package_type: $('p-type').value,
                package_count: num('p-count') || 1,
                weight_kg: num('p-weight'),
                length_cm: num('p-length'),
                width_cm: num('p-width'),
                height_cm: num('p-height'),
                declared_value: num('p-value'),
                service_type: $('p-service').value,
                payer: $('p-payer').value,
                is_fragile: $('p-fragile').checked,
                delivery_instructions: txt('p-notes')
            }).select().single();

            btn.disabled = false;
            btn.textContent = "Créer l'expédition";

            if (error) { dShow("Erreur : " + error.message); return; }
            e.target.reset();
            showTab('list');
            dShow("Expédition créée ! Code de suivi : " + data.tracking_code + (data.estimated_delivery_at ? " · Livraison estimée : " + fmtDate(data.estimated_delivery_at) : ""), 'success');
        });

        $('track-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const out = $('track-result');
            const code = $('track-code').value.trim();
            out.innerHTML = '<p class="text-center text-gray-500">Recherche...</p>';

            const { data, error } = await supabaseClient.rpc('sw_track_shipment', { p_code: code });
            if (error) { out.innerHTML = ''; dShow("Erreur : " + error.message); return; }
            dHide();
            if (!data) {
                out.innerHTML = '<div class="bg-white rounded-2xl border border-gray-100 p-6 text-center text-gray-500">Aucun colis trouvé avec ce code. Vérifiez-le et réessayez.</div>';
                return;
            }
            out.innerHTML = `<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
                <div class="flex items-start justify-between gap-2">
                    <div><p class="font-bold text-gray-900">${esc(data.tracking_code)}</p>
                    <p class="text-sm text-gray-500">${esc(data.origin)} → ${esc(data.destination)}</p></div>
                    ${badge(data.status)}
                </div>
                ${timeline(data.events, data)}
            </div>`;
        });

        $('logout-btn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            showAuthView();
        });

        // =====================================================
        //                    DÉMARRAGE
        // =====================================================
        supabaseClient.auth.getSession().then(({ data }) => {
            if (data.session) showDashView(data.session.user);
            else showAuthView();
        });
    </script>
</body>
</html>
