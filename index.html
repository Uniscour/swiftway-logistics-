<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftWay Logistics - Connexion / Inscription</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        swiftblue: '#0047AB',
                    }
                }
            }
        }
    </script>
    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center p-4 relative">

    <!-- Bouton de changement de langue (Haut droite) -->
    <div class="absolute top-6 right-6">
        <button id="lang-toggle" type="button" class="flex items-center gap-2 bg-white px-4 py-2 rounded-full shadow-sm border border-gray-200 text-sm font-semibold text-gray-700 hover:bg-gray-100 transition cursor-pointer">
            🌐 <span id="current-lang-text">EN</span>
        </button>
    </div>

    <!-- Carte Principale -->
    <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md border border-gray-100 transition-all duration-300">
        
        <!-- En-tête Pro -->
        <div class="text-center mb-6 pt-2">
            <h1 class="text-3xl font-extrabold text-swiftblue tracking-tight">SwiftWay Logistics</h1>
            <p id="t-subtitle" class="text-base text-gray-500 mt-2 font-medium">Gérez vos expéditions facilement</p>
        </div>

        <!-- Sélecteur d'onglets : Connexion / Inscription -->
        <div class="flex bg-gray-100 p-1 rounded-xl mb-6">
            <button id="tab-login" type="button" class="flex-1 py-2.5 text-sm font-semibold rounded-lg bg-white text-swiftblue shadow-sm transition cursor-pointer">Connexion</button>
            <button id="tab-signup" type="button" class="flex-1 py-2.5 text-sm font-semibold rounded-lg text-gray-500 hover:text-gray-900 transition cursor-pointer">S'inscrire</button>
        </div>

        <!-- Message d'alerte -->
        <div id="alert-box" class="hidden mb-6 p-4 rounded-xl text-sm text-center font-medium"></div>

        <!-- FORMULAIRE DE CONNEXION -->
        <form id="login-form" class="space-y-5">
            <div>
                <label id="t-login-email" class="block text-sm font-semibold text-gray-700 mb-1.5">Email</label>
                <input type="email" id="login-email" required placeholder="votre@email.com" 
                    class="w-full px-5 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue focus:border-swiftblue outline-none transition bg-gray-50">
            </div>

            <div>
                <label id="t-login-pass" class="block text-sm font-semibold text-gray-700 mb-1.5">Mot de passe</label>
                <div class="relative">
                    <input type="password" id="login-password" required placeholder="••••••••" 
                        class="w-full px-5 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue focus:border-swiftblue outline-none transition bg-gray-50">
                    <button type="button" class="toggle-password absolute right-4 top-3.5 text-gray-400 hover:text-swiftblue transition cursor-pointer">👁️</button>
                </div>
            </div>

            <button type="submit" id="login-btn" 
                class="w-full bg-swiftblue hover:bg-blue-700 text-white font-semibold py-3.5 rounded-xl transition duration-200 shadow-md cursor-pointer">
                Se connecter
            </button>
        </form>

        <!-- FORMULAIRE D'INSCRIPTION -->
        <form id="signup-form" class="space-y-4 hidden">
            <div>
                <label id="t-signup-email" class="block text-xs font-semibold text-gray-700 mb-1">Email</label>
                <input type="email" id="signup-email" required placeholder="votre@email.com" 
                    class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue focus:border-swiftblue outline-none transition bg-gray-50">
            </div>

            <div>
                <label id="t-signup-phone" class="block text-xs font-semibold text-gray-700 mb-1">Numéro de téléphone</label>
                <input type="tel" id="signup-phone" required placeholder="Ex: +237 6XXXXXXXX" 
                    class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue focus:border-swiftblue outline-none transition bg-gray-50">
            </div>

            <div>
                <label id="t-signup-pass" class="block text-xs font-semibold text-gray-700 mb-1">Mot de passe</label>
                <div class="relative">
                    <input type="password" id="signup-password" required placeholder="••••••••" 
                        class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue focus:border-swiftblue outline-none transition bg-gray-50">
                    <button type="button" class="toggle-password absolute right-4 top-3 text-gray-400 hover:text-swiftblue transition cursor-pointer">👁️</button>
                </div>
            </div>

            <div>
                <label id="t-signup-pass-confirm" class="block text-xs font-semibold text-gray-700 mb-1">Confirmer le mot de passe</label>
                <div class="relative">
                    <input type="password" id="signup-password-confirm" required placeholder="••••••••" 
                        class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-swiftblue focus:border-swiftblue outline-none transition bg-gray-50">
                    <button type="button" class="toggle-password absolute right-4 top-3 text-gray-400 hover:text-swiftblue transition cursor-pointer">👁️</button>
                </div>
            </div>

            <button type="submit" id="signup-btn" 
                class="w-full bg-swiftblue hover:bg-blue-700 text-white font-semibold py-3.5 rounded-xl transition duration-200 shadow-md mt-2 cursor-pointer">
                S'inscrire
            </button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://cwgpxyiodzxcabkavdbk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_zXgU5Q2p2UL3--3no-spmA_noD8JRvF';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const tabLogin = document.getElementById('tab-login');
        const tabSignup = document.getElementById('tab-signup');
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const alertBox = document.getElementById('alert-box');

        function hideAlert() { alertBox.classList.add('hidden'); }

        tabLogin.addEventListener('click', () => {
            tabLogin.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg bg-white text-swiftblue shadow-sm transition cursor-pointer";
            tabSignup.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg text-gray-500 hover:text-gray-900 transition cursor-pointer";
            loginForm.classList.remove('hidden');
            signupForm.classList.add('hidden');
            hideAlert();
        });

        tabSignup.addEventListener('click', () => {
            tabSignup.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg bg-white text-swiftblue shadow-sm transition cursor-pointer";
            tabLogin.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg text-gray-500 hover:text-gray-900 transition cursor-pointer";
            signupForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
            hideAlert();
        });

        const translations = {
            fr: {
                subtitle: "Gérez vos expéditions facilement",
                loginTab: "Connexion",
                signupTab: "S'inscrire",
                email: "Email",
                password: "Mot de passe",
                confirmPassword: "Confirmer le mot de passe",
                phone: "Numéro de téléphone",
                loginBtn: "Se connecter",
                signupBtn: "S'inscrire",
                langToggleDisplay: "EN",
                processing: "Traitement en cours...",
                successLogin: "Connexion réussie ! Cliquez ici pour ouvrir le tableau de bord",
                successSignup: "Compte créé avec succès ! Cliquez ici pour ouvrir le tableau de bord",
                passMismatch: "Les mots de passe ne correspondent pas."
            },
            en: {
                subtitle: "Manage your shipments easily",
                loginTab: "Login",
                signupTab: "Sign up",
                email: "Email",
                password: "Password",
                confirmPassword: "Confirm Password",
                phone: "Phone Number",
                loginBtn: "Login",
                signupBtn: "Sign up",
                langToggleDisplay: "FR",
                processing: "Processing...",
                successLogin: "Login successful! Click here to open dashboard",
                successSignup: "Account created successfully! Click here to open dashboard",
                passMismatch: "Passwords do not match."
            }
        };

        let currentLang = 'fr';

        function updateLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            document.getElementById('current-lang-text').textContent = t.langToggleDisplay;
            document.getElementById('t-subtitle').textContent = t.subtitle;
            tabLogin.textContent = t.loginTab;
            tabSignup.textContent = t.signupTab;
            document.getElementById('t-login-email').textContent = t.email;
            document.getElementById('t-login-pass').textContent = t.password;
            document.getElementById('login-btn').textContent = t.loginBtn;
            document.getElementById('t-signup-email').textContent = t.email;
            document.getElementById('t-signup-phone').textContent = t.phone;
            document.getElementById('t-signup-pass').textContent = t.password;
            document.getElementById('t-signup-pass-confirm').textContent = t.confirmPassword;
            document.getElementById('signup-btn').textContent = t.signupBtn;
        }

        document.getElementById('lang-toggle').addEventListener('click', (e) => {
            e.preventDefault();
            updateLanguage(currentLang === 'fr' ? 'en' : 'fr');
        });

        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const input = e.target.previousElementSibling;
                const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);
                e.target.textContent = type === 'password' ? '👁️' : '🙈';
            });
        });

        function showSuccessWithLink(message) {
            alertBox.innerHTML = `${message} <br><br><a href="dashboard.html" class="inline-block bg-swiftblue text-white px-4 py-2 rounded-xl font-bold text-xs shadow hover:bg-blue-700 transition">🚀 Accéder au Tableau de bord</a>`;
            alertBox.className = "mb-6 p-4 rounded-xl text-sm text-center font-medium bg-green-50 text-green-700 border border-green-100";
            alertBox.classList.remove('hidden');
        }

        function showAlert(message, type = 'error') {
            alertBox.textContent = message;
            alertBox.className = `mb-6 p-4 rounded-xl text-sm text-center font-medium ${type === 'error' ? 'bg-red-50 text-red-700 border border-red-100' : 'bg-green-50 text-green-700 border border-green-100'}`;
            alertBox.classList.remove('hidden');
        }

        // Connexion
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const t = translations[currentLang];

            showAlert(t.processing, 'success');
            let { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                showAlert(error.message);
            } else {
                showSuccessWithLink(t.successLogin);
                // Tente aussi la redirection automatique en arrière-plan au cas où
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
            }
        });

        // Inscription
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signup-email').value.trim();
            const phone = document.getElementById('signup-phone').value.trim();
            const password = document.getElementById('signup-password').value;
            const passwordConfirm = document.getElementById('signup-password-confirm').value;
            const t = translations[currentLang];

            if (password !== passwordConfirm) {
                showAlert(t.passMismatch);
                return;
            }

            showAlert(t.processing, 'success');

            let { data, error } = await supabaseClient.auth.signUp({
                email,
                password,
                options: {
                    data: { phone_number: phone }
                }
            });

            if (error) {
                showAlert(error.message);
            } else {
                showSuccessWithLink(t.successSignup);
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
            }
        });
    </script>
</body>
</html>
