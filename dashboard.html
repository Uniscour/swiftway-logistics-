<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftWay Logistics - Tableau de bord</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { swiftblue: '#0047AB' } } } }
    </script>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Chargement -->
    <div id="loading" class="min-h-screen flex items-center justify-center text-gray-500 font-medium">
        Chargement...
    </div>

    <!-- Contenu (caché tant que la session n'est pas vérifiée) -->
    <div id="app" class="hidden">
        <header class="bg-white border-b border-gray-200">
            <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
                <h1 class="text-xl font-extrabold text-swiftblue tracking-tight">SwiftWay Logistics</h1>
                <button id="logout-btn" type="button"
                    class="text-sm font-semibold text-gray-600 hover:text-red-600 border border-gray-200 rounded-full px-4 py-2 bg-white transition cursor-pointer">
                    Se déconnecter
                </button>
            </div>
        </header>

        <main class="max-w-4xl mx-auto px-4 py-8 space-y-6">
            <section class="bg-white rounded-3xl shadow-sm border border-gray-100 p-6">
                <h2 class="text-2xl font-bold text-gray-900">Bienvenue 👋</h2>
                <p class="text-gray-500 mt-1">Vous êtes connecté à votre espace SwiftWay.</p>

                <dl class="mt-6 grid gap-4 sm:grid-cols-2">
                    <div class="bg-gray-50 rounded-2xl p-4">
                        <dt class="text-xs font-semibold text-gray-500">Email</dt>
                        <dd id="user-email" class="mt-1 font-semibold text-gray-900 break-all">-</dd>
                    </div>
                    <div class="bg-gray-50 rounded-2xl p-4">
                        <dt class="text-xs font-semibold text-gray-500">Téléphone</dt>
                        <dd id="user-phone" class="mt-1 font-semibold text-gray-900">-</dd>
                    </div>
                </dl>
            </section>

            <section class="bg-white rounded-3xl shadow-sm border border-gray-100 p-6">
                <h2 class="text-lg font-bold text-gray-900">Mes expéditions</h2>
                <p class="text-gray-500 mt-2 text-sm">Aucune expédition pour le moment. Vos envois apparaîtront ici.</p>
            </section>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://cwgpxyiodzxcabkavdbk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_zXgU5Q2p2UL3--3no-spmA_noD8JRvF';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Nom de ta page de connexion (change-le si ton fichier s'appelle autrement)
        const LOGIN_PAGE = 'index.html';

        async function init() {
            const { data } = await supabaseClient.auth.getSession();
            const session = data.session;

            if (!session) {
                window.location.replace(LOGIN_PAGE);
                return;
            }

            const user = session.user;
            document.getElementById('user-email').textContent = user.email || '-';
            document.getElementById('user-phone').textContent =
                (user.user_metadata && user.user_metadata.phone_number) || '-';

            document.getElementById('loading').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
        }

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.replace(LOGIN_PAGE);
        });

        init();
    </script>
</body>
</html>
