<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion / Inscription - SwiftWay Logistics</title>
    <!-- Intégration de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Intégration de la bibliothèque officielle Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-blue-600 mb-6">SwiftWay Logistics</h2>

        <!-- Formulaire de Connexion -->
        <form id="authForm" class="space-y-4">
            <div>
                <label class="block text-gray-700 font-medium mb-1">Email</label>
                <input type="email" id="email" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="votre@email.com">
            </div>

            <!-- Mot de passe avec option voir/masquer -->
            <div>
                <label class="block text-gray-700 font-medium mb-1">Mot de passe</label>
                <div class="relative">
                    <input type="password" id="password" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••">
                    <button type="button" onclick="togglePassword('password', 'eyeIcon1')" class="absolute right-3 top-3 text-gray-500 hover:text-gray-700 focus:outline-none">
                        <!-- Icône Œil -->
                        <svg id="eyeIcon1" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Bouton de validation -->
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition duration-200">
                Se connecter / S'inscrire
            </button>
        </form>
    </div>

    <!-- Script JavaScript : Lien Supabase et logique de connexion -->
    <script>
        // 1. Connexion au pont Supabase avec tes clés configurées
        const SUPABASE_URL = 'https://cwgpxyiodzxcabkavdbk.supabase.co';
        const SUPABASE_ANON_KEY = 'Sb_publishable_zXgU5Q2p2UL3--3no-spmA_noD8JRvF';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. Fonction pour voir/masquer le mot de passe
        function togglePassword(fieldId, iconId) {
            const passwordField = document.getElementById(fieldId);
            if (passwordField.type === "password") {
                passwordField.type = "text";
            } else {
                passwordField.type = "password";
            }
        }

        // 3. Gestion de la soumission du formulaire
        document.getElementById('authForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            alert("Connexion en cours avec l'email : " + email);
        });
    </script>

</body>
</html>
